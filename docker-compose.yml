services:
  pgdb:
    image: postgres:14
    environment:
      POSTGRES_DB: djaerolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - pg-data-volume:/var/lib/postgresql/data
      # - ${HOME}/Downloads:/opt/downloads
      # load example:
      # uncomment the ${HOME}/Downloads and replace with your own desired location
      # psql -U postgres -c 'create database djaerolith_prod_backup'
      # psql -U postgres djaerolith_prod_backup < /opt/downloads/backup_20190818-050001.sql
    expose:
      - 5432
    ports:
      - 5437:5432
    networks:
      aeronet:


  app:
    env_file:
      - ./webolith/config/local_config.env
    build: ./webolith
    working_dir: /opt/webolith/djAerolith
    volumes:
      - ./webolith:/opt/webolith:rw
    depends_on:
      - pgdb
      - word_db_server
    links:
      - pgdb
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - aeronet
    labels:
      - "traefik.http.routers.aerolith.rule=Host(`aerolith.localhost`)"
      - "traefik.http.routers.aerolith.entrypoints=web"
      - "traefik.http.services.aerolith.loadbalancer.server.port=8000"
      - traefik.enable=true

  proxy:
    image: "traefik:v3.6"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aerolith-infra_aeronet"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aeronet
    security_opt:
      - no-new-privileges:true

  word_db_server:
    build:
      context: ./word_db_server
      dockerfile: Dockerfile-dev
    environment:
      WDB_DATA_PATH: /opt/data
      LOG_LEVEL: debug
      # this secret key is the same one as in the local_config.env in
      # webolith. These should match.
      SECRET_KEY: "0gc6=82_ehrw-@fv1a8dqq^6%zuxxu)f^5belgu68cuu*zr&qu"
      DB_MIGRATIONS_PATH: file:///opt/word_db_server/db/migrations
      # These db parameters should match the ones in local_config.env
      DB_CONN_URI: postgres://postgres:pass@pgdb:5432/djaerolith?sslmode=disable
    volumes:
      - ./lexica:/opt/data/lexica
      - ./letterdistributions:/opt/data/letterdistributions
      - ./word_db_server:/opt/word_db_server:rw
    command: sh -c "go run -race cmd/searchserver/*.go"
    networks:
      - aeronet
    labels:
      - "traefik.http.routers.word_db_server.rule=Host(`aerolith.localhost`) && PathPrefix(`/word_db_server/`)"
      - "traefik.http.routers.word_db_server.middlewares=word_db_server-stripprefix"
      - "traefik.http.middlewares.word_db_server-stripprefix.stripprefix.prefixes=/word_db_server/"
      - "traefik.http.routers.word_db_server.entrypoints=web"
      - "traefik.http.services.word_db_server.loadbalancer.server.port=8180"
      - traefik.enable=true

  vite_wordwalls:
    build:
      context: ./webolith
      dockerfile: wordwalls.dockerfile
    volumes:
      - ./webolith:/opt/webolith:rw
    working_dir: /opt/webolith
    command: bash -c "npm install && npm run dev:wordwalls -- --host"
    networks:
      - aeronet
    ports:
      - "8097:8097"
    labels:
      - "traefik.http.routers.vite_wordwalls.rule=Host(`aerolith.localhost`) && PathPrefix(`/static/js/wordwalls`)"
      - "traefik.http.routers.vite_wordwalls.priority=100"
      - "traefik.http.routers.vite_wordwalls.service=vite_wordwalls-service"
      - "traefik.http.services.vite_wordwalls-service.loadbalancer.server.port=8097"
      - "traefik.http.routers.vite_wordwalls.entrypoints=web"
      - traefik.enable=true

  vite_wordvault:
    # Vite is what we will slowly move towards. For now it's just the
    # wordvault flashcard app.
    build:
      context: ./webolith/frontend
      dockerfile: Dockerfile-dev
    volumes:
      - ./webolith/frontend:/opt/webolith-fe
    working_dir: /opt/webolith-fe
    command: bash -c "npm install && npm run dev -- --host"
    networks:
      - aeronet
    labels:
      - traefik.enable=true
      - "traefik.http.routers.vite_wordvault.rule=Host(`aerolith.localhost`) && PathPrefix(`/wordvault`)"
      - "traefik.http.routers.vite_wordvault.service=vite_wordvault-service"
      - "traefik.http.routers.vite_wordvault.entrypoints=web"
      - "traefik.http.services.vite_wordvault-service.loadbalancer.server.port=5173"

  legacy_flashcards:
    build:
      context: ./webolith
      dockerfile: wordwalls.dockerfile
    volumes:
      - ./webolith/djAerolith/flashcards:/opt/webolith/flashcards:rw
    working_dir: /opt/webolith/flashcards
    command: bash -c "npm install && npm run dev"
    networks:
      - aeronet
    ports:
      - "8089:8089"
    labels:
      - "traefik.http.routers.legacy_flashcards.rule=Host(`aerolith.localhost`) && PathPrefix(`/static/js/flashcards`)"
      - "traefik.http.routers.legacy_flashcards.service=legacy_flashcards-service"
      - "traefik.http.services.legacy_flashcards-service.loadbalancer.server.port=8089"
      - "traefik.http.routers.legacy_flashcards.entrypoints=web"
      - traefik.enable=true
      - "traefik.http.middlewares.flashcards-stripprefix.stripprefix.prefixes=/static/js/flashcards"
      - "traefik.http.routers.legacy_flashcards.middlewares=flashcards-stripprefix"

volumes:
  pg-data-volume:
    external: false

networks:
  aeronet:
    driver: bridge
